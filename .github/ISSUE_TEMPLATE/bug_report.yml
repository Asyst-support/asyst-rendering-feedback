name: 🐛 Bug report
description: Something rendered wrong, lost a connection, or the panel misbehaved.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ASysT Rendering! Your model files are yours — never feel obliged
        to attach them; a screenshot is often enough.
  - type: input
    id: version
    attributes:
      label: ASysT Rendering version
      description: "Extensions view → ASysT Rendering (e.g. 0.1.8)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw. Screenshots help a lot.
    validations:
      required: true
  - type: input
    id: model-size
    attributes:
      label: Roughly how big is the model?
      placeholder: "e.g. 5 .sysml files"
  - type: dropdown
    id: view
    attributes:
      label: Which view, if a diagram looks wrong?
      options:
        - Not sure / not applicable
        - Definition
        - Internal structure
        - State machine
        - Action flow
        - Sequence
        - Tree
        - Table
